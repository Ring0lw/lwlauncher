[package]
name = "lwlauncher"
version = "1.0.4"
edition = "2024"
rust-version = "1.85"
description = "LinusWare launcher"
license = "GPL-3.0-only"
publish = false

[dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "x11", "wayland"] }
glow = "0.18"
ab_glyph = "0.2.32"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
md-5 = "0.10"

[build-dependencies]
resvg = { version = "0.45", default-features = false }
flate2 = "1.1"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
